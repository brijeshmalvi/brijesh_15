<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prediction Website</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: white;
      width: 90%;
      max-width: 450px;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    h1 {
      color: #333;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background: #667eea;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #5568d9;
    }

    #result {
      margin-top: 25px;
      padding: 15px;
      border-radius: 10px;
      background: #f1f3f5;
      font-size: 20px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>🔮 Prediction</h1>

    <input type="number" id="number1" placeholder="Enter first number">
    <input type="number" id="number2" placeholder="Enter second number">

    <button onclick="makePrediction()">Predict</button>

    <div id="result">
      Enter values to get a prediction
    </div>
  </div>

  <script>
    function makePrediction() {

      let a = Number(document.getElementById("number1").value);
      let b = Number(document.getElementById("number2").value);

      if (!a || !b) {
        document.getElementById("result").innerHTML =
          "⚠️ Please enter both values";
        return;
      }

      // Example prediction calculation
      let prediction = (a + b) / 2;

      document.getElementById("result").innerHTML =
        "🔮 Prediction: " + prediction.toFixed(2);
    }
  </script>

</body>
</html>
