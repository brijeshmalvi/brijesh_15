<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prediction App</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      background: white;
      padding: 30px;
      width: 350px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    }

    h1 {
      text-align: center;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #result {
      margin-top: 20px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Prediction</h1>

    <label>Enter Value 1:</label>
    <input type="number" id="value1">

    <label>Enter Value 2:</label>
    <input type="number" id="value2">

    <button onclick="predict()">Predict</button>

    <div id="result"></div>
  </div>

  <script>
    function predict() {
      const value1 = Number(document.getElementById("value1").value);
      const value2 = Number(document.getElementById("value2").value);

      if (isNaN(value1) || isNaN(value2)) {
        document.getElementById("result").innerText =
          "Please enter both values.";
        return;
      }

      // Simple prediction logic
      const prediction = (value1 + value2) / 2;

      document.getElementById("result").innerText =
        "Predicted Value: " + prediction.toFixed(2);
    }
  </script>

</body>
</html>
